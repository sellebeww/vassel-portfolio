<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1920" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Not found — Vassel Goleyu</title>
    <!-- Served by static hosts (Vercel, Netlify, GitHub Pages) for unknown paths. Same tokens as src/styles.css. -->
    <style>
      @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/newsreader.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 400; font-display: swap; src: url("/fonts/newsreader-italic-subset.woff2") format("woff2"); unicode-range: U+2E, U+47, U+65-66, U+6C-6D, U+6F-70, U+73-75, U+79; }
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/geist.woff2") format("woff2"); }
      :root { --ink: #0f1920; --text-1: #efe9df; --text-2: #c6c2b9; --text-3: #a29e96; --lamp: #f0bf94; --line: rgb(239 233 223 / .14); color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 50% at 70% 20%, rgb(240 191 148 / .08), transparent 70%), var(--ink); color: var(--text-1); font: 400 16px/1.6 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: var(--lamp); color: var(--ink); }
      main { width: min(520px, 100%); }
      small { display: block; margin-bottom: 24px; color: var(--lamp); font: 500 12px/1 "Geist", system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; }
      h1 { margin: 0 0 20px; font: 400 clamp(48px, 10vw, 88px)/.95 "Newsreader", Georgia, serif; letter-spacing: -.03em; }
      h1 em { color: var(--lamp); }
      p { margin: 0 0 32px; color: var(--text-2); max-width: 38ch; }
      a { display: inline-flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 24px; border-radius: 999px; background: var(--lamp); color: var(--ink); font-weight: 500; text-decoration: none; transition: background .16s; }
      a:hover { background: #f8d3ae; }
      a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
      footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--text-3); font: 400 12px/1.4 "Geist", system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <small>404 · Page not found</small>
      <h1>This room is <em>empty.</em></h1>
      <p>The address doesn’t lead anywhere. The portfolio, its projects and the contact page are all one door away.</p>
      <a href="/">Back to the studio <span aria-hidden="true">→</span></a>
      <footer>Vassel Goleyu · Full-stack developer</footer>
    </main>
  </body>
</html>
